<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      --c-bg: #fafaf8;
      --c-surface: #ffffff;
      --c-border: #e0ded8;
      --c-text: #1c1b18;
      --c-text-sec: #5c5a52;
      --c-accent: #2a5e6b;
      --c-accent-hover: #1e4a55;
      --c-tip-bg: #f0ece4;
      --c-tip-border: #c8c1b3;
      --c-code-bg: #f4f3f0;
      --c-table-header: #f7f6f3;
      --c-table-border: #e8e6e0;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
      --max-w: 860px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #1a1918;
        --c-surface: #242320;
        --c-border: #3d3b35;
        --c-text: #e8e6e0;
        --c-text-sec: #9e9b92;
        --c-accent: #5fb8cc;
        --c-accent-hover: #7ecadb;
        --c-tip-bg: #2a2824;
        --c-tip-border: #4a463c;
        --c-code-bg: #2c2b27;
        --c-table-header: #2a2925;
        --c-table-border: #3d3b35;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.7;
      color: var(--c-text);
      background: var(--c-bg);
      -webkit-font-smoothing: antialiased;
    }

    .page-wrap {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 400;
      line-height: 1.25;
      margin: 0 0 12px;
      text-wrap: balance;
    }

    h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 400;
      margin: 48px 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--c-accent);
      color: var(--c-accent);
    }

    h3 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 400;
      margin: 32px 0 12px;
    }

    h4 {
      font-size: 15px;
      font-weight: 600;
      margin: 20px 0 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--c-text-sec);
    }

    p { margin: 0 0 16px; }

    a { color: var(--c-accent); text-decoration: none; }
    a:hover { color: var(--c-accent-hover); text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid var(--c-border);
      margin: 36px 0;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin: 12px 0 20px;
    }
    th {
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--c-text-sec);
      padding: 8px 12px;
      background: var(--c-table-header);
      border-bottom: 1px solid var(--c-border);
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--c-table-border);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }

    /* Blockquotes as tips */
    blockquote {
      background: var(--c-tip-bg);
      border-left: 3px solid var(--c-tip-border);
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin: 12px 0 20px;
      font-size: 14px;
      color: var(--c-text-sec);
    }
    blockquote strong { color: var(--c-text); }
    blockquote p { margin: 0; }

    /* Details/summary */
    details {
      margin: 12px 0 20px;
    }
    details summary {
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--c-accent);
      padding: 6px 0;
    }
    details summary:hover { text-decoration: underline; }
    details[open] summary { margin-bottom: 8px; }

    /* Ordered lists */
    ol {
      margin: 8px 0 16px 24px;
      font-size: 15px;
      color: var(--c-text-sec);
    }
    ol li { margin-bottom: 4px; }
    ol strong { color: var(--c-text); }

    /* Images — small thumbnail with click to enlarge */
    .page-wrap img {
      max-width: 280px;
      height: auto;
      border: 1px solid var(--c-border);
      border-radius: 6px;
      margin: 12px 0;
      cursor: zoom-in;
      transition: box-shadow .2s, transform .2s;
    }
    .page-wrap img:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      transform: scale(1.02);
    }

    /* Lightbox overlay */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.85);
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      padding: 24px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
      cursor: zoom-out;
      border: none;
    }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 20px;
      font-size: 32px;
      color: #fff;
      cursor: pointer;
      z-index: 10000;
      line-height: 1;
      opacity: .7;
      transition: opacity .15s;
    }
    .lightbox-close:hover { opacity: 1; }

    /* Code */
    code {
      background: var(--c-code-bg);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 13px;
    }

    /* TOC */
    #inhaltsverzeichnis + ol {
      columns: 2;
      column-gap: 32px;
    }
    @media (max-width: 600px) {
      #inhaltsverzeichnis + ol { columns: 1; }
    }

    /* Footer */
    .page-wrap > :last-child {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--c-border);
      font-size: 13px;
      color: var(--c-text-sec);
      font-style: italic;
    }

    @media print {
      .lightbox { display: none !important; }
      img { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    {{ content }}
  </div>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    (function() {
      var lb = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');
      var lbClose = document.getElementById('lightbox-close');

      document.querySelectorAll('.page-wrap img').forEach(function(img) {
        img.addEventListener('click', function() {
          lbImg.src = this.src;
          lbImg.alt = this.alt;
          lb.classList.add('active');
        });
      });

      lb.addEventListener('click', function() {
        lb.classList.remove('active');
        lbImg.src = '';
      });

      lbClose.addEventListener('click', function() {
        lb.classList.remove('active');
        lbImg.src = '';
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          lb.classList.remove('active');
          lbImg.src = '';
        }
      });
    })();
  </script>
</body>
</html>
